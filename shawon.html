<script>
"use strict";
/* ===== CRYPTO: pure-JS SHA-512 + Ed25519 (BigInt, no WebCrypto, offline) ===== */
const M64=(1n<<64n)-1n;
function isq(n){let x=1n<<BigInt((n.toString(2).length>>1)+1);for(;;){const y=(x+n/x)>>1n;if(y>=x)return x;x=y}}
function icb(n){let x=1n<<BigInt(Math.ceil(n.toString(2).length/3)+1);for(;;){const y=(2n*x+n/(x*x))/3n;if(y>=x)return x;x=y}}
const PR=[];for(let n=2;PR.length<80;n++){if(PR.every(p=>n%p))PR.push(n)}
const K512=PR.map(p=>icb(BigInt(p)<<192n)&M64),H512=PR.slice(0,8).map(p=>isq(BigInt(p)<<128n)&M64);
function sha512(m){const rot=(x,n)=>((x>>n)|(x<<(64n-n)))&M64;const l=m.length,pl=((l+17+127)>>7)<<7,B=new Uint8Array(pl);B.set(m);B[l]=128;const dv=new DataView(B.buffer);dv.setUint32(pl-4,(l*8)>>>0);dv.setUint32(pl-8,Math.floor(l/536870912));let h=H512.slice();
for(let o=0;o<pl;o+=128){const w=[];for(let i=0;i<16;i++)w.push(dv.getBigUint64(o+i*8));
for(let i=16;i<80;i++){const a=w[i-15],c=w[i-2];w.push((w[i-16]+(rot(a,1n)^rot(a,8n)^(a>>7n))+w[i-7]+(rot(c,19n)^rot(c,61n)^(c>>6n)))&M64)}
let v=h.slice();for(let i=0;i<80;i++){const[a,b,c,d,e,f,g,hh]=v,t1=(hh+(rot(e,14n)^rot(e,18n)^rot(e,41n))+((e&f)^(~e&M64&g))+K512[i]+w[i])&M64,t2=((rot(a,28n)^rot(a,34n)^rot(a,39n))+((a&b)^(a&c)^(b&c)))&M64;v=[(t1+t2)&M64,a,b,c,(d+t1)&M64,e,f,g]}
h=h.map((x,i)=>(x+v[i])&M64)}
const out=new Uint8Array(64),ov=new DataView(out.buffer);h.forEach((x,i)=>ov.setBigUint64(i*8,x));return out}
const Q=(1n<<255n)-19n,LQ=(1n<<252n)+27742317777372353535851937790883648493n,md=(a,m=Q)=>((a%m)+m)%m;
function pw(b,e,m=Q){let r=1n;b=md(b,m);while(e>0n){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n}return r}
const iv=x=>pw(x,Q-2n),DC=md(-121665n*iv(121666n)),SQ=pw(2n,(Q-1n)/4n);
function rx(y,s){const x2=md((y*y-1n)*iv(DC*y*y+1n));let x=pw(x2,(Q+3n)/8n);if(md(x*x-x2))x=md(x*SQ);if(md(x*x-x2))throw 0;if(Number(x&1n)!==s)x=Q-x;return x}
const BY=md(4n*iv(5n)),BP=[rx(BY,0),BY];
function ad(p,q){const[x1,y1]=p,[x2,y2]=q,t=DC*x1*x2*y1*y2;return[md((x1*y2+x2*y1)*iv(1n+t)),md((y1*y2+x1*x2)*iv(1n-t))]}
function ml(p,k){let r=[0n,1n];while(k>0n){if(k&1n)r=ad(r,p);p=ad(p,p);k>>=1n}return r}
const le=b=>{let n=0n;for(let i=b.length-1;i>=0;i--)n=(n<<8n)|BigInt(b[i]);return n};
const unle=(n,l)=>{const o=new Uint8Array(l);for(let i=0;i<l;i++){o[i]=Number(n&255n);n>>=8n}return o};
const dec25=b=>{const y=le(b)&((1n<<255n)-1n);if(y>=Q)throw 0;return[rx(y,b[31]>>7),y]};
const enc25=p=>{const o=unle(p[1],32);o[31]|=Number(p[0]&1n)<<7;return o};
const cat=(...a)=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let i=0;a.forEach(x=>{o.set(x,i);i+=x.length});return o};

const b64e=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

const u8=s=>new TextEncoder().encode(s);

/* ===== LICENSE MODULE (replaceable): getState(), activate(key), isActive() ===== */
const LICENSE=(()=>{const APP='AMS',PFX='AMS',PUB_KEY_B64='lONIoqwk3-wI0_LY21n2JBChheQWkDKWqMBqZoO2YUg',TRIAL=5*864e5;
const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}},s=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let dev='',seed='',t0=0,seen=0,code='',roll=false,err='',st={status:'expired',msg:'লোড হচ্ছে…'};
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
const devId=()=>{const h=hex(sha512(u8('AMSDEV|'+seed)));return'XXXDEV-'+h.slice(0,4)+'-'+h.slice(4,8)+'-'+h.slice(8,12)};
function check(c){const m=/^AMS-([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(String(c).trim());if(!m)return{ok:0,err:'১) কোডের ফরম্যাট ঠিক নেই (AMS-… দিয়ে শুরু ও মাঝে "." থাকতে হবে)।'};
 let pb,sb,p;try{pb=b64d(m[1]);sb=b64d(m[2]);p=JSON.parse(new TextDecoder().decode(pb))}catch(e){return{ok:0,err:'১) কোডের ফরম্যাট ঠিক নেই (পড়া যায়নি)।'}}
 if(!edVerify(sb,pb,b64d(PUB_KEY_B64)))return{ok:0,err:'২) সিগনেচার মেলেনি — কোডটি ভুল বা পরিবর্তিত।'};
 if(p.app!==APP)return{ok:0,err:'৩) এই কোডটি অন্য কোম্পানির ফাইলের জন্য ('+String(p.app).slice(0,12)+')।'};
 if(p.dev!==dev)return{ok:0,err:'৪) এই কোডটি অন্য ডিভাইসের জন্য — Device ID মেলেনি।'};
 if(p.plan!=='lifetime'&&p.plan!=='yearly')return{ok:0,err:'৫) প্ল্যান বোঝা যায়নি।'};
 if(p.plan==='yearly'){const e=new Date(p.exp+'T23:59:59');if(isNaN(e)||Date.now()>e)return{ok:0,err:'৫) ইয়ার্লি লাইসেন্সের মেয়াদ শেষ ('+p.exp+')।'}}
 return{ok:1,p}}
function calc(){const now=Date.now();roll=!!seen&&now<seen-6e5;if(!roll&&now>seen){seen=now;s('ams_seen',String(seen))}
 if(code){const r=check(code);if(r.ok&&!roll){st={status:'active',plan:r.p.plan,exp:r.p.exp||'',msg:r.p.plan==='lifetime'?'লাইফটাইম লাইসেন্স চালু':'ইয়ার্লি লাইসেন্স চালু — মেয়াদ '+r.p.exp};return}if(!r.ok)err=r.err}
 const left=Math.ceil((t0+TRIAL-now)/864e5);
 if(roll)st={status:'expired',msg:'সিস্টেম তারিখ পিছানো ধরা পড়েছে — লক। লাইসেন্স কোড দিন।'};
 else if(left>0)st={status:'trial',daysLeft:left,msg:'ট্রায়াল চলছে — আর '+left+' দিন বাকি'};
 else st={status:'expired',msg:'ট্রায়াল শেষ — শুধু দেখা ও JSON এক্সপোর্ট চলবে। সেভ করতে লাইসেন্স কোড দিন।'}}
const sync=()=>{try{return put('kv',{k:'lic',v:{seed,t0,seen,code}})}catch(e){}};
async function init(kv){const r=(kv.find(x=>x.k==='lic')||{}).v||{};seed=g('ams_seed')||r.seed||'';if(!seed){const a=new Uint8Array(16);crypto.getRandomValues(a);seed=hex(a)}
 t0=+g('ams_t0')||+r.t0||0;if(!t0)t0=Date.now();seen=Math.max(+g('ams_seen')||0,+r.seen||0);code=g('ams_code')||r.code||'';
 s('ams_seed',seed);s('ams_t0',String(t0));s('ams_seen',String(seen));if(code)s('ams_code',code);dev=devId();calc();await sync()}
function activate(k){const r=check(k);if(!r.ok)return{ok:0,msg:r.err};code=String(k).trim();s('ams_code',code);err='';calc();sync();return{ok:1,msg:'লাইসেন্স চালু হয়েছে ✔'}}
return{init,activate,getState:()=>({...st,dev,err}),isActive:()=>st.status!=='expired'}})();
const LOCKMSG='ট্রায়াল শেষ বা লাইসেন্স নেই — সেভ বন্ধ। License পেজে কোড দিন।';
function licBanner(){const t=LICENSE.getState();return`<div class="warn"${t.status==='expired'?' style="background:#fdecec;border-color:#e8b4b4"':''}><b>${esc(t.msg)}</b> <button class="btn sec" data-v="lic">License</button></div>`}
function lic(m){const t=LICENSE.getState();m.innerHTML=`<h1>License</h1><div class="card"><h3>অবস্থা: ${esc(t.msg)}</h3><p>আপনার Device ID:</p><p><b id="di" style="font-size:18px">${esc(t.dev)}</b> <button class="btn sec" id="cp">Copy</button></p><p>এই Device ID আমাকে পাঠান, আমি আপনাকে Activator Code দেব।</p>${t.err&&t.status!=='active'?'<div class="warn" style="background:#fdecec">'+esc(t.err)+'</div>':''}<textarea id="lk" rows="3" placeholder="AMS-…" style="width:100%"></textarea><div class="bar"><button class="btn" id="ac">Activate</button></div></div>`;

/* ===== AUTO-SAVE customers & products (no duplicates; fills blank fields only) ===== */
async function autoSave(d){try{const nz=x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim(),c=d.cust||{},n=nz(c.name);
 if(n){const ex=S.customers.find(x=>nz(x.name)===n&&(!x.mobile||!c.mobile||nz(x.mobile)===nz(c.mobile))),f={contact:c.attn,mobile:c.mobile,email:c.email,address:c.address,type:c.type};
  if(ex){let ch=0;for(const k in f)if(f[k]&&!ex[k]){ex[k]=f[k];ch=1}if(ch)await put('customers',ex)}
  else{const o={id:crypto.randomUUID(),name:c.name.trim(),contact:c.attn||'',mobile:c.mobile||'',email:c.email||'',address:c.address||'',type:c.type||'',daddress:'',designation:'',notes:''};await put('customers',o);S.customers.push(o)}}
 for(const r of d.rows){const nm=nz(r.description);if(!nm)continue;const ex=S.products.find(x=>nz(x.name)===nm||nz([x.name,x.size,x.material&&!x.name.includes(x.material)?'('+x.material+')':''].filter(Boolean).join(', '))===nm);

 <div class="card" style="overflow:auto"><h3>Invoice-wise</h3>${L.length?`<table class="l"><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Due</th><th>Status</th><th></th></tr>${L.map(x=>`<tr><td>${esc(x.d.number)}</td><td>${esc(x.d.date)}</td><td>${esc(x.d.cust.name)}<br>${ctag(x.d.cust.type)}</td><td>${fm(x.i.g)}</td><td>${fm(x.i.pd)}</td><td>${fm(Math.max(0,x.i.du))}</td><td>${pbadge(x.d)}</td><td><button class="btn sec" data-a="pay" data-i="${x.d.id}">+ Payment</button> <button class="btn sec" data-a="view" data-i="${x.d.id}">Open</button></td></tr>`).join('')}</table>`:'<div class="empty">No invoices match.</div>'}</div>`}
let ist={p:'',c:'',t:'all'};
function items(m){m.innerHTML=`<h1>Item History</h1><div class="warn">Every item from your saved quotations, invoices and challans is listed here automatically, so there is nothing to save twice. Search by product or by company.</div><div class="bar"><input id="ip" style="max-width:280px" placeholder="Search product…" value="${esc(ist.p)}"><input id="ic" style="max-width:280px" placeholder="Search company…" value="${esc(ist.c)}"><select id="it" style="max-width:190px"><option value="all">All types</option>${Object.entries(T).map(([k,v])=>`<option value="${k}"${ist.t===k?' selected':''}>${v}</option>`).join('')}</select></div><div id="ires"></div>`;
 const up=()=>{ist.p=$('ip').value;ist.c=$('ic').value;ist.t=$('it').value;itemsRes()};$('ip').oninput=up;$('ic').oninput=up;$('it').onchange=up;itemsRes()}
function itemsRes(){const p=ist.p.trim().toLowerCase(),c=ist.c.trim().toLowerCase(),L=[];
 S.docs.forEach(d=>d.rows.forEach((r,i)=>{if((ist.t==='all'||d.type===ist.t)&&(!p||String(r.description).toLowerCase().includes(p))&&(!c||String(d.cust.name).toLowerCase().includes(c)))L.push({d,r,i})}));
 L.sort((a,b)=>(b.d.date||'').localeCompare(a.d.date||'')||(b.d.modified||0)-(a.d.modified||0));
 const real=L.filter(x=>!x.r.alt),amt=real.filter(x=>x.d.type!=='challan').reduce((s,x)=>s+lineP(x.r),0);
 $('ires').innerHTML=L.length?`<div class="card"><b>${L.length}</b> item(s) · Total quantity: ${esc(qtyBy(real.map(x=>x.r)))}${amt?' · Billed (quotation/invoice): '+fm(amt)+' BDT':''}</div><div class="card" style="overflow:auto"><table class="l"><tr><th>Date</th><th>Document</th><th>Company</th><th>Product</th><th>Qty</th><th>Rate</th><th>Amount</th><th></th></tr>${L.slice(0,300).map(x=>`<tr><td>${esc(x.d.date)}</td><td>${esc(x.d.number)}<br><small>${T[x.d.type]}</small></td><td>${esc(x.d.cust.name)}</td><td>${esc(x.r.description)}${x.r.alt?' <small>(alt)</small>':''}</td><td>${esc(x.r.qty)} ${esc(x.r.unit)}</td><td>${x.d.type==='challan'?'—':fm(P(x.r.rate))+' / '+esc(x.r.unit)}</td><td>${x.d.type==='challan'?'—':fm(lineP(x.r))}</td><td><button class="btn sec" data-a="view" data-i="${x.d.id}">Open</button> <button class="btn sec" data-a="sp" data-i="${x.d.id}:${x.i}">Save to Products</button></td></tr>`).join('')}</table>${L.length>300?'<p>Showing the newest 300. Narrow your search to see more.</p>':''}</div>`:'<div class="card empty">No items match. Items appear here after you save a document.</div>'}
function set(m){const s=S.set,n=s.num;m.innerHTML=`<h1>Settings</h1><div class="card"><h3>Document numbering (last confirmed issued number)</h3><div class="g">${[['q','Quotation'],['invoice','Invoice'],['challan','Delivery Challan']].map(([k,l])=>`<div><label>${l} prefix</label><input id="p_${k}" value="${esc(n[k].p)}"><label>Last issued number</label><input id="n_${k}" type="number" value="${n[k].n}"></div>`).join('')}</div><h3>Defaults</h3><div class="g"><div><label>Default VAT treatment</label><select id="dv"><option value="none">Not applicable</option><option value="included">Included in rates</option><option value="extra">Added separately</option></select></div><div><label>Default VAT %</label><input id="dr" type="number" step="any" value="${esc(s.vatRate)}"></div></div><div class="g"><div><label>Default document font</label><select id="dfont">${Object.entries(FONTS).map(([k,v])=>`<option value="${k}"${(s.font||'cal')===k?' selected':''}>${v[0]}</option>`).join('')}</select></div></div><label>Default terms &amp; conditions (quotation / invoice)</label><textarea id="dt" style="min-height:130px">${esc(s.terms)}</textarea><div class="bar"><button class="btn" data-a="sset">Save settings</button></div></div><div class="card"><h3>Signature</h3>${s.sig?`<img src="${s.sig}" style="height:60px;background:#fff;border:1px solid #ddd;mix-blend-mode:multiply"><br>`:'<p>No signature uploaded. Documents print with the typed name only.</p>'}<label>Upload signature image (PNG/JPG, dark ink on light or transparent background)</label><input type="file" id="sg" accept="image/*"><div class="bar">${s.sig?'<button class="btn dng" data-a="rsig">Remove signature</button>':''}</div></div><div class="warn">Company letterhead, logo, QR code and footer are fixed graphics embedded in this file and cannot be changed from the document editor.</div>`;$('dv').value=s.vat}
async function setSave(){const s=S.set;for(const k of['q','invoice','challan']){const p=$('p_'+k).value.trim(),n=parseInt($('n_'+k).value);if(!p||isNaN(n)||n<0)return toast('Check the numbering fields.',1);s.num[k]={p,n}}s.font=$('dfont').value;s.vat=$('dv').value;s.vatRate=$('dr').value;s.terms=$('dt').value;await saveSet();toast('Settings saved')}
function backup(m){m.innerHTML=`<h1>Backup &amp; Restore</h1><div class="warn">Records live only in this browser. Clearing browsing data or switching browser/profile erases them. Export a backup regularly and keep it somewhere safe (USB, email, cloud drive).</div><div class="card"><div class="bar"><button class="btn" data-a="bx">Export full backup</button><button class="btn sec" data-a="bi">Import full backup</button><button class="btn sec" data-a="di">Import single document</button></div><p>Documents: ${S.docs.length} · Customers: ${S.customers.length} · Products: ${S.products.length}</p></div>`}
function pick(cb){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{cb(JSON.parse(await i.files[0].text()))}catch(x){toast('This file is not a valid BAM backup.',1)}};i.click()}
const okDoc=d=>d&&typeof d.id==='string'&&T[d.type]&&typeof d.number==='string'&&d.cust&&typeof d.cust.name==='string'&&Array.isArray(d.rows)&&d.rows.every(r=>r&&typeof r==='object');
function restore(){pick(async b=>{if(!b||b.app!=='AMS'||!Array.isArray(b.documents)||!Array.isArray(b.customers)||!Array.isArray(b.products))return toast('This file is not a BAM backup.',1);
 const nm=x=>!x||typeof x.id!=='string'||typeof x.name!=='string',bad=b.documents.filter(x=>!okDoc(x)).length+b.customers.filter(nm).length+b.products.filter(nm).length;
 if(bad)return toast('Backup has '+bad+' damaged record(s). Nothing was changed.',1);
 const ids=new Set(),nos=new Set();for(const x of b.documents){const k=x.type+'|'+x.number.toLowerCase();if(ids.has(x.id)||nos.has(k))return toast('Backup has duplicate IDs or document numbers. Nothing was changed.',1);ids.add(x.id);nos.add(k)}
 const rep=confirm('Backup is valid: '+b.documents.length+' documents, '+b.customers.length+' customers, '+b.products.length+' products.\n\nOK = REPLACE all current data with this backup\nCancel = choose merge instead');
 if(!rep&&!confirm('Merge instead? Existing records stay; only new ones are added.'))return;
 const hv=k=>new Set(rep?[]:S[k].map(x=>x.id)),hd=hv('docs'),hc=hv('customers'),hp=hv('products'),hn=new Set(rep?[]:S.docs.map(x=>x.type+'|'+x.number.toLowerCase()));let skip=0;
 try{await new Promise((ok,no)=>{const t=db.transaction(['docs','customers','products','kv'],'readwrite');
  if(rep)['docs','customers','products'].forEach(s=>t.objectStore(s).clear());
  b.documents.forEach(x=>{if(hd.has(x.id)||hn.has(x.type+'|'+x.number.toLowerCase())){skip++;return}t.objectStore('docs').put(x)});
  b.customers.forEach(x=>{if(!hc.has(x.id))t.objectStore('customers').put(x)});b.products.forEach(x=>{if(!hp.has(x.id))t.objectStore('products').put(x)});
  if(rep&&b.settings&&b.settings.num)t.objectStore('kv').put({k:'settings',v:b.settings});
  t.oncomplete=ok;t.onabort=t.onerror=()=>no(t.error||new Error('cancelled'))});
  S.docs=await all('docs');S.customers=await all('customers');S.products=await all('products');const k=(await all('kv')).find(x=>x.k==='settings');if(k)S.set=k.v;
  toast('Restore complete'+(skip?' ('+skip+' skipped: already present)':''));draw()}catch(x){toast('Restore failed, your existing data is unchanged: '+x.message,1)}})}
function importDoc(){pick(async b=>{if(b.app!=='AMS'||!okDoc(b.doc))return toast('Not a valid AMS document file.',1);const d=b.doc;if(S.docs.some(x=>x.id===d.id)){if(!confirm('This document already exists. Import as a new copy?'))return;d.id=crypto.randomUUID()}if(S.docs.some(x=>x.type===d.type&&x.number===d.number)){toast('Number '+d.number+' already exists — change it, then save.',1);d.number=nextNo(d.type==='quotation'?'q':d.type)}await put('docs',d);S.docs.push(d);toast('Imported');draw()})}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('error',e=>toast('Unexpected error: '+e.message,1));
(async()=>{try{db=await open();S.docs=await all('docs');S.customers=await all('customers');S.products=await all('products');const KV=await all('kv');await LICENSE.init(KV);await seedProducts(KV);const k=KV.find(x=>x.k==='settings');
 S.set=k?k.v:{num:JSON.parse(JSON.stringify(DEF)),vat:'none',vatRate:'',terms:'1. This Price Quotation is Valid for 10 Days\n2. Price May change without prior notice.'};if(!k)await saveSet();draw()}
 catch(x){$('main').innerHTML='<div class="card"><h1>Storage unavailable</h1><p>This browser blocked local storage ('+esc(x.message)+'). Documents cannot be saved here. Open this file in Google Chrome from your computer.</p></div>'}})();
</script></body></html>
